services:
  mainkanroute:
    build: .
    image: mainkanroute:latest
    container_name: mainkanroute
    restart: always
    ports:
      - "20131:20128"
    volumes:
      - mainkanroute-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      INITIAL_PASSWORD: "admin"

volumes:
  mainkanroute-data:
    name: mainkanroute-data
